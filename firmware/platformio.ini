; PlatformIO project for the Celebration Dispenser firmware.
; Board: Adafruit ESP32-S2 Feather (4 MB flash, 2 MB PSRAM).
;
; Platform is pinned to espressif32 6.9.0 (arduino-esp32 2.0.x). The audio
; streaming library (ESP32-audioI2S) is pinned to a 2.x-compatible tag to match.

[env:featheresp32s2]
platform = espressif32@6.9.0
board = adafruit_feather_esp32s2
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DBOARD_HAS_PSRAM
; on-board audio files live in a LittleFS partition (upload with `pio run -t uploadfs`)
board_build.filesystem = littlefs
board_build.partitions = partitions_audio.csv
; exclude the bench-test tools from the main firmware build
build_src_filter = +<*> -<tools/>
lib_deps =
    waspinator/AccelStepper@^1.64
    adafruit/Adafruit NeoPixel@^1.12.3
    teemuatlut/TMCStepper@^0.7.3
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6

; Standalone motor bring-up test: `pio run -e motortest -t upload`
; Builds only src/tools/motor_test.cpp — no WiFi/audio/secrets.h required.
[env:motortest]
platform = espressif32@6.9.0
board = adafruit_feather_esp32s2
framework = arduino
monitor_speed = 115200
build_flags = -Wall
build_src_filter = +<tools/motor_test.cpp>
lib_deps =
    waspinator/AccelStepper@^1.64
    teemuatlut/TMCStepper@^0.7.3

; Standalone audio streaming test: `pio run -e audiotest -t upload`
; Builds only src/tools/audio_test.cpp — needs WiFi in include/secrets.h.
[env:audiotest]
platform = espressif32@6.9.0
board = adafruit_feather_esp32s2
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DBOARD_HAS_PSRAM
build_src_filter = +<tools/audio_test.cpp>
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6

; Raw I2S tone test (no WiFi/decode/library): `pio run -e tonetest -t upload`
; The definitive check of the I2S wiring + amp + speaker.
[env:tonetest]
platform = espressif32@6.9.0
board = adafruit_feather_esp32s2
framework = arduino
monitor_speed = 115200
build_flags = -Wall
build_src_filter = +<tools/tone_test.cpp>

; LittleFS audio test — plays a file from flash (the real audio path, no WiFi):
;   pio run -e fstest -t uploadfs   (upload data/ audio)
;   pio run -e fstest -t upload     (flash the test)
[env:fstest]
platform = espressif32@6.9.0
board = adafruit_feather_esp32s2
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DBOARD_HAS_PSRAM
board_build.filesystem = littlefs
board_build.partitions = partitions_audio.csv
build_src_filter = +<tools/fs_audio_test.cpp>
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6

; Raw WAV player (no decode/library) — the reliable audio path for the S2:
;   pio run -e wavtest -t upload      (flash + partition table)
;   pio run -e wavtest -t uploadfs    (upload data/idle.wav)
[env:wavtest]
platform = espressif32@6.9.0
board = adafruit_feather_esp32s2
framework = arduino
monitor_speed = 115200
build_flags = -Wall
board_build.filesystem = littlefs
board_build.partitions = partitions_audio.csv
build_src_filter = +<tools/wav_test.cpp>
