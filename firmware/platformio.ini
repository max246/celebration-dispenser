; PlatformIO project for the Celebration Dispenser firmware.
; Board: Adafruit ESP32-S2 Feather (4 MB flash, 2 MB PSRAM).
;
; Platform is pinned to espressif32 6.9.0 (arduino-esp32 2.0.x). The audio
; streaming library (ESP32-audioI2S) is pinned to a 2.x-compatible tag to match.

[env:featheresp32s2]
platform = espressif32@6.9.0
board = adafruit_feather_esp32s2
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DBOARD_HAS_PSRAM
lib_deps =
    waspinator/AccelStepper@^1.64
    adafruit/Adafruit NeoPixel@^1.12.3
    teemuatlut/TMCStepper@^0.7.3
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
